# Single-node research-first scheduler. No GPU sharing or suspension of GPU jobs.
ClusterName=llmops-research
SlurmctldHost=llmops(127.0.1.1)
SlurmUser=slurm
SlurmdUser=root
SlurmctldPort=6817
SlurmdPort=6818
CommunicationParameters=NoCtldInAddrAny,disable_http
AuthType=auth/munge
CredType=cred/munge
StateSaveLocation=/var/lib/slurm/slurmctld
SlurmdSpoolDir=/var/lib/slurm/slurmd
SlurmctldPidFile=/run/slurmctld/slurmctld.pid
SlurmdPidFile=/run/slurmd/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info
SlurmctldTimeout=120
SlurmdTimeout=300
ReturnToService=2
SchedulerType=sched/backfill
SchedulerParameters=bf_interval=10
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/job-completion.log
GresTypes=gpu
PreemptType=preempt/partition_prio
PreemptMode=REQUEUE
JobRequeue=1
KillWait=15
UnkillableStepTimeout=60
DefMemPerCPU=2048
Prolog=/etc/slurm/gpu-idle-prolog.sh
PrologFlags=Alloc,Contain
PrologEpilogTimeout=15

# Leave two physical cores and roughly 7 GiB of host memory outside job allocation.
NodeName=llmops NodeHostname=llmops NodeAddr=127.0.1.1 CPUs=32 Boards=1 SocketsPerBoard=1 CoresPerSocket=16 ThreadsPerCore=2 CoreSpecCount=2 RealMemory=40000 Gres=gpu:rtx_5090:1 State=UNKNOWN
PartitionName=research Nodes=llmops Default=YES PriorityTier=100 PreemptMode=OFF OverSubscribe=NO MaxTime=7-00:00:00 State=UP
# Snapshot after model enablement. For a fresh installation keep this partition DOWN until ready.
PartitionName=llm Nodes=llmops Default=NO PriorityTier=10 PreemptMode=REQUEUE GraceTime=15 OverSubscribe=NO MaxCPUsPerNode=8 MaxMemPerNode=28000 MaxTime=1-00:00:00 AllowGroups=llmops State=UP
